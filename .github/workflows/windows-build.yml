name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore "Trickster Launcher.sln"

      - name: Build Release Win32
        run: msbuild "Trickster Launcher.sln" /m /p:Configuration=Release /p:Platform=Win32 /p:RestorePackagesConfig=true

      - name: Upload Launcher binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trickster-launcher-release
          path: |
            Output/Trickster Launcher/Splash.exe
            Output/Trickster Launcher/LauncherUpdater.exe
            Output/Trickster Launcher/WebView2Loader.dll
          retention-days: 30

      - name: Upload FileListGen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: filelistgen-release
          path: Output/FileListGen/FileListGen.exe
          retention-days: 30
