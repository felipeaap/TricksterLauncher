name: Windows Build & Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore "Trickster Launcher.sln"

      - name: Build Solution (Release x86)
        run: |
          msbuild "Trickster Launcher.sln" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /p:RestorePackagesConfig=true

      - name: Run Unit Tests
        run: |
          Write-Host "Running TricksterLauncherTests..."
          $result = & "Output\Tests\TricksterLauncherTests.exe"
          Write-Host $result
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Unit tests FAILED with exit code $LASTEXITCODE"
            exit 1
          }
          Write-Host "All tests passed."

      - name: Package Release Artifacts
        if: success()
        run: |
          New-Item -ItemType Directory -Force -Path "Output\ReleasePackage" | Out-Null
          Copy-Item "Output\Trickster Launcher\Splash.exe" "Output\ReleasePackage\"
          Copy-Item "Output\Trickster Launcher\LauncherUpdater.exe" "Output\ReleasePackage\"
          Copy-Item "Output\Trickster Launcher\WebView2Loader.dll" "Output\ReleasePackage\"
          Copy-Item "config.example.json" "Output\ReleasePackage\"
          
          Compress-Archive -Path "Output\ReleasePackage\*" -DestinationPath "Output\TricksterLauncher-win32.zip" -Force
          Compress-Archive -Path "Output\FileListGen\FileListGen.exe" -DestinationPath "Output\FileListGen-win32.zip" -Force

          Get-FileHash -Algorithm SHA256 "Output\TricksterLauncher-win32.zip", "Output\FileListGen-win32.zip" |
            ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content "Output\SHA256SUMS.txt"

      - name: Upload Launcher Zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TricksterLauncher-win32
          path: Output/TricksterLauncher-win32.zip
          retention-days: 30

      - name: Upload FileListGen Zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileListGen-win32
          path: Output/FileListGen-win32.zip
          retention-days: 30

      - name: Upload Checksums
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: Output/SHA256SUMS.txt
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/TricksterLauncher-win32.zip
            Output/FileListGen-win32.zip
            Output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
